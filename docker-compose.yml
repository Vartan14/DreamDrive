services:
  auth_user_service_app:
    container_name: auth_user_service-app-1
    build:
      context: ./backend/auth_user_service
      dockerfile: Dockerfile
      args:
        - DEV=true
    ports:
      - "8000:8000"
    volumes:
      - ./backend/auth_user_service/app:/app
    command: >
      sh -c "python manage.py wait_for_db &&
             python manage.py runserver 0.0.0.0:8000"
    env_file:
      - ./backend/auth_user_service/.env
    depends_on:
      - auth_user_service_db

  auth_user_service_db:
    image: postgres:15-alpine
    container_name: auth_user_service-db-1
    ports:
      - "5432:5432"
    volumes:
      - dev-db-data:/var/lib/postgresql/data
    env_file:
      - ./backend/auth_user_service/.env

  learning_service_app:
    container_name: learning_service-app-1
    build:
      context: ./backend/learning_service
      dockerfile: Dockerfile
      args:
        - DEV=true
    ports:
      - "8001:8001"
    volumes:
      - ./backend/learning_service/app:/app
    command: >
      sh -c "python manage.py wait_for_db &&
      python manage.py runserver 0.0.0.0:8001"
    env_file:
      - ./backend/learning_service/.env
    depends_on:
      - learning_service_db

  learning_service_db:
    image: postgres:15-alpine
    container_name: learning_service-db-1
    ports:
      - "5433:5433"
    volumes:
      - ls-db-data:/var/lib/postgresql/data
    env_file:
      - ./backend/learning_service/.env

  schedule_service_app:
    container_name: schedule_service-app-1
    build:
      context: ./backend/schedule_service
      dockerfile: Dockerfile
      args:
        - DEV=true
    ports:
      - "8002:8002"
    volumes:
      - ./backend/schedule_service/app:/app
    command: >
      sh -c "python manage.py wait_for_db &&
      python manage.py runserver 0.0.0.0:8002"
    env_file:
      - ./backend/schedule_service/.env
    depends_on:
      - schedule_service_db

  schedule_service_db:
    image: postgres:15-alpine
    container_name: schedule_service-db-1
    ports:
      - "5434:5434"
    volumes:
      - ss-db-data:/var/lib/postgresql/data
    env_file:
      - ./backend/schedule_service/.env

  payment_service_app:
    container_name: payment_service-app-1
    build:
      context: ./backend/payment_service
      dockerfile: Dockerfile
      args:
        - DEV=true
    ports:
      - "8003:8003"
    volumes:
      - ./backend/payment_service/app:/app
    command: >
      sh -c "python manage.py wait_for_db &&
             python manage.py runserver 0.0.0.0:8003"
    env_file:
      - ./backend/payment_service/.env
    depends_on:
      - payment_service_db

  payment_service_db:
    image: postgres:15-alpine
    container_name: payment_service-db-1
    ports:
      - "5435:5435"
    volumes:
      - ps-db-data:/var/lib/postgresql/data
    env_file:
      - ./backend/payment_service/.env


  api_gateway:
    container_name: api_gateway-app-1
    build:
      context: ./backend/api_gateway
      dockerfile: Dockerfile
      args:
        - DEV=true
    ports:
      - "8005:8005"
    volumes:
      - ./backend/api_gateway/app:/app
    env_file:
      - ./backend/api_gateway/.env
    command: >
      sh -c "uvicorn main:app --host 0.0.0.0 --port 8005 --reload"
    depends_on:
      - auth_user_service_app
      - learning_service_app
      - schedule_service_app

