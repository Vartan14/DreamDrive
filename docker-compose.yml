services:
  auth_user_service_app:
    container_name: auth_user_service-app-1
    build:
      context: ./backend/auth_user_service
      dockerfile: Dockerfile
      args:
        - DEV=true
    ports:
      - "8000:8000"
    volumes:
      - ./backend/auth_user_service/app:/app
    command: >
      sh -c "python manage.py wait_for_db &&
             python manage.py runserver 0.0.0.0:8000"
    env_file:
      - ./backend/auth_user_service/.env
    depends_on:
      - auth_user_service_db

  auth_user_service_db:
    image: postgres:15-alpine
    container_name: auth_user_service-db-1
    ports:
      - "5432:5432"
    volumes:
      - dev-db-data:/var/lib/postgresql/data
    env_file:
      - ./backend/auth_user_service/.env

